workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - a
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.jausips92.ipadpos
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jausips92.ipadpos
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Get Flutter packages
        script: |
          cd ipad_pos_app
          flutter pub get
      - name: Run Flutter tests
        script: |
          cd ipad_pos_app
          flutter test
      - name: Set up iOS code signing
        script: |
          cd ipad_pos_app
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          security find-identity -v -p codesigning
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"
      - name: Build signed iOS IPA
        script: |
          cd ipad_pos_app
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - ipad_pos_app/build/ios/ipa/*.ipa
      - ipad_pos_app/build/ios/archive/*.xcarchive
